<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff6ea">
<title>Life of Game</title>
<style>
:root {
  --bg: #fff6ea; --ink: #2a1f17; --soft: #7a6a5c; --line: #eadccb; --card: #ffffff;
  --accent: #ff5a36; --accent-ink: #ffffff; --good: #18a058; --bad: #d7413a; --gold: #f2a900;
  --money: #18a058; --health: #e0475b; --happy: #f2a900;
  --radius: 22px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; justify-content: center;
}
#app { width: 100%; max-width: 480px; min-height: 100%; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 40px; line-height: 1.05; margin: 32px 0 4px; letter-spacing: -1px; }
h2 { font-size: 26px; line-height: 1.15; margin: 0; }
p { margin: 0; }
.muted { color: var(--soft); }
.small { font-size: 15px; }
.grow { flex: 1; }
.center { text-align: center; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; }
button, input {
  font: inherit; min-height: 56px; border-radius: 16px; border: 2px solid var(--line);
  padding: 12px 18px; background: var(--card); color: var(--ink);
}
button { cursor: pointer; font-weight: 650; touch-action: manipulation; }
button:active { transform: scale(0.98); }
button:disabled { opacity: 0.45; cursor: default; transform: none; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.ghost { background: transparent; }
input { width: 100%; }
input.code { text-transform: uppercase; letter-spacing: 6px; text-align: center; font-weight: 700; }
.card { background: var(--card); border-radius: var(--radius); padding: 22px; box-shadow: 0 6px 24px rgba(80, 50, 20, 0.08); }
.err { color: var(--bad); min-height: 1.4em; }

/* stats bar */
.stats { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat { flex: 1; background: var(--card); border-radius: 14px; padding: 8px 10px; text-align: center; }
.stat .k { display: block; font-size: 12px; font-weight: 600; color: var(--soft); text-transform: uppercase; letter-spacing: 0.5px; }
.stat.m .v { color: var(--money); } .stat.h .v { color: var(--health); } .stat.p .v { color: #b37d00; }

.topline { display: flex; justify-content: space-between; color: var(--soft); font-size: 15px; font-weight: 600; }
.timer { height: 8px; background: var(--line); border-radius: 8px; overflow: hidden; }
.timer > i { display: block; height: 100%; background: var(--accent); width: 100%; transition: width 0.25s linear; }
.opt { width: 100%; text-align: left; font-size: 19px; padding: 16px 18px; min-height: 64px; }
.opt.chosen { border-color: var(--accent); background: #fff0eb; }
.opt .def { display: block; font-size: 13px; font-weight: 600; color: var(--soft); }

.ticks { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tick { font-size: 15px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: var(--card); color: var(--soft); }
.tick.on { background: #e3f6ea; color: var(--good); }
.tick.off { opacity: 0.5; }

.slots { display: grid; gap: 10px; }
.slot { display: flex; justify-content: space-between; align-items: center; background: var(--card); border-radius: 16px; padding: 14px 18px; min-height: 56px; font-weight: 650; }
.slot.empty { background: transparent; border: 2px dashed var(--line); color: var(--soft); font-weight: 500; }
.badge { font-size: 14px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--line); color: var(--soft); }
.badge.ok { background: #e3f6ea; color: var(--good); }
.bigcode { font-size: 56px; font-weight: 800; letter-spacing: 10px; text-align: center; }

.rev { display: flex; flex-direction: column; gap: 10px; }
.revrow { background: var(--card); border-radius: 16px; padding: 14px 16px; opacity: 0; animation: pop 0.35s ease-out forwards; }
.revrow .who { font-weight: 750; }
.revrow .what { color: var(--soft); font-size: 16px; }
.deltas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.d { font-size: 15px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--bg); }
.d.up { color: var(--good); } .d.down { color: var(--bad); }
.tag { font-size: 12px; font-weight: 700; color: var(--soft); background: var(--line); border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.hero { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 10px; }
.emoji { font-size: 72px; line-height: 1; }
.rank { display: flex; align-items: center; gap: 12px; }
.rank .n { font-size: 28px; font-weight: 800; width: 36px; color: var(--soft); }
.rank .s { margin-left: auto; font-size: 24px; font-weight: 800; }
.banner { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 15px; z-index: 5; max-width: 92vw; }
.banner:empty { display: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="banner" class="banner"></div>

<!-- ======================================================================
     CONFIG: every tuning number lives here.
     ====================================================================== -->
<script id="config">
'use strict';
const CONFIG = {
  version: '0.2',                  // shown on the menu; bump on every release (GitHub Pages caches for 10 minutes)
  minPlayers: 1,                   // 1 so you can poke at it alone; the game is built for 4
  maxPlayers: 4,
  roundsPerStage: 4,
  stages: [
    { name: 'Teens and uni', emoji: '🎓' },
    { name: 'Early career', emoji: '💼' },
    { name: 'Settling down', emoji: '🏡' },
    { name: 'Midlife chaos', emoji: '🏍️' },
    { name: 'Retirement', emoji: '🌻' },
  ],
  timings: {                       // seconds
    stageIntro: 4,
    card: 3,                       // card shown before you can pick
    pick: 20,
    reveal: 8,
    spin: 4,                       // placeholder spotlight screen until the wheel arrives in M5 (target about 8)
  },
  start: { money: 1000, health: 70, happiness: 60 },
  caps: { health: [0, 100], happiness: [0, 100] },
  moneyStep: 10,                   // rolled money is rounded to this
  score: { moneyPer: 500, moneyCap: 100, moneyFloor: -40, goalMultiplier: 1.5 },
  idleAfter: 6,                    // seconds without a heartbeat before a player counts as disconnected
};
</script>

<!-- ======================================================================
     SIM: the authoritative game. Runs only on the host's device.
     Pure logic, no DOM, so tests run it in Node.
     ====================================================================== -->
<script id="sim">
'use strict';
const Sim = (() => {
  let rand = Math.random;
  let EVENTS = [];
  const T = CONFIG.timings;
  const ROUNDS = CONFIG.stages.length * CONFIG.roundsPerStage;
  const SHOWS_CARD = ['card', 'pick', 'reveal', 'spin'];
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  function createGame() {
    return { phase: 'lobby', players: {}, order: [], round: 0, card: null, picks: {}, deadline: 0, reveal: null, used: [], spotlight: null, stats: {} };
  }
  const list = g => Object.values(g.players);
  const stageOf = round => Math.ceil(round / CONFIG.roundsPerStage);

  // -> { ok } or { err: 'full' | 'started' }
  function addPlayer(g, id, name, now = 0) {
    const p = g.players[id];
    if (p) { p.name = name; p.connected = true; p.seen = now; return { ok: true }; }
    if (g.phase !== 'lobby') return { err: 'started' };
    if (list(g).length >= CONFIG.maxPlayers) return { err: 'full' };
    g.players[id] = { id, name, connected: true, seen: now, ready: false, ...CONFIG.start };
    return { ok: true };
  }
  function setConnected(g, id, on, now = 0) {
    const p = g.players[id];
    if (!p) return false;
    if (on) p.seen = now;
    if (p.connected === on) return false;
    if (!on && g.phase === 'lobby') { delete g.players[id]; return true; }   // free the slot
    p.connected = on;
    return true;
  }
  function setReady(g, id, on) {
    const p = g.players[id];
    if (!p || g.phase !== 'lobby') return false;
    p.ready = !!on;
    return true;
  }
  const canStart = g => g.phase === 'lobby' && list(g).length >= CONFIG.minPlayers && list(g).every(p => p.ready && p.connected);

  function start(g, now) {
    if (!canStart(g)) return false;
    g.order = list(g).map(p => p.id);
    for (const p of list(g)) Object.assign(p, CONFIG.start);
    g.used = [];
    g.round = 1;
    g.phase = 'stage';
    g.deadline = now + T.stageIntro * 1000;
    return true;
  }

  function drawCard(g) {
    const stage = stageOf(g.round);
    let pool = EVENTS.filter(e => e.stage === stage && !g.used.includes(e.id));
    if (!pool.length) pool = EVENTS.filter(e => e.stage === stage);            // ran dry: allow repeats
    let r = rand() * pool.reduce((a, e) => a + (e.weight || 1), 0);
    const card = pool.find(e => (r -= e.weight || 1) < 0) || pool[pool.length - 1];
    g.used.push(card.id);
    return card;
  }

  function beginRound(g, now) {
    g.card = drawCard(g);
    g.picks = {};
    g.reveal = null;
    g.spotlight = g.order[(g.round - 1) % g.order.length];
    g.phase = 'card';
    g.deadline = now + T.card * 1000;
  }

  function pick(g, id, idx) {
    if (g.phase !== 'pick' || !g.players[id] || g.picks[id] != null) return false;
    if (!Number.isInteger(idx) || idx < 0 || idx >= g.card.options.length) return false;
    g.picks[id] = idx;
    return true;
  }

  const roll = ([lo, hi]) => lo + Math.floor(rand() * (hi - lo + 1));
  function resolve(g, now) {
    const opts = g.card.options;
    const def = Math.max(0, opts.findIndex(o => o.default));
    const rows = [];
    for (const id of g.order) {
      const p = g.players[id];
      const auto = g.picks[id] == null;
      const idx = auto ? def : g.picks[id];
      const fx = opts[idx].effects || {};
      const before = { money: p.money, health: p.health, happiness: p.happiness };
      if (fx.money) p.money += Math.round(roll(fx.money) / CONFIG.moneyStep) * CONFIG.moneyStep;
      if (fx.health) p.health = clamp(p.health + roll(fx.health), ...CONFIG.caps.health);
      if (fx.happiness) p.happiness = clamp(p.happiness + roll(fx.happiness), ...CONFIG.caps.happiness);
      rows.push({ id, idx, auto, delta: { money: p.money - before.money, health: p.health - before.health, happiness: p.happiness - before.happiness } });
    }

<!-- ======================================================================
     NETWORKING: PeerJS rooms (the same setup as Hob Mob).
     The host's device runs the Sim; everyone else sends picks and draws the view the host sends them.
       client -> host: hello {id, name, inst, v} · ready {on} · pick {idx} · ping
       host -> client: welcome · view {view} · full · started · version {v} · dupe
     ====================================================================== -->
<script>
'use strict';
const Net = (() => {
  const PREFIX = 'lifeofgame-v1-';
  const LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  const CONNECT_TIMEOUT = 12000;
  const available = () => typeof Peer !== 'undefined';
  const randomCode = () => Array.from({ length: 4 }, () => LETTERS[Math.floor(Math.random() * LETTERS.length)]).join('');
  const cleanCode = s => String(s || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);

  function describe(err) {
    switch (err && err.type) {
      case 'peer-unavailable': return 'No room with that code. Check it and try again.';
      case 'browser-incompatible': return 'This browser does not support WebRTC.';
      case 'network': case 'server-error': case 'socket-error': case 'socket-closed':
        return 'Could not reach the matchmaking server. Check your internet connection.';
      default: return (err && err.message) || 'Something went wrong with the connection.';
    }
  }

  function host(handlers, wantCode) {
    let peer = null, tries = 0, wantTries = 0, destroyed = false;
    const attempt = () => {
      const code = wantCode || randomCode();
      peer = new Peer(PREFIX + code, { debug: 0 });
      peer.on('open', () => handlers.onReady(code));
      peer.on('connection', conn => handlers.onConnection(conn));
      peer.on('disconnected', () => { if (!destroyed && !peer.destroyed) setTimeout(() => !destroyed && peer.reconnect(), 1000); });
      peer.on('error', err => {
        if (err.type === 'unavailable-id' && wantCode) {
          peer.destroy();
          if (++wantTries >= 10) wantCode = null;
          setTimeout(() => !destroyed && attempt(), 1500);
          return;
        }
        if (err.type === 'unavailable-id' && tries++ < 5) { peer.destroy(); attempt(); return; }
        if (err.type === 'peer-unavailable') return;
        handlers.onError(err);
      });
    };
    attempt();
    return { destroy() { destroyed = true; if (peer) peer.destroy(); } };
  }

  function join(code, handlers) {
    const peer = new Peer({ debug: 0 });
    let conn = null, opened = false, done = false;
    const fail = err => { if (done) return; done = true; clearTimeout(timer); handlers.onError(err); };
    const timer = setTimeout(() => { if (!opened) fail({ type: 'timeout', message: 'Could not connect to that room (timed out).' }); }, CONNECT_TIMEOUT);
    peer.on('open', () => {
      conn = peer.connect(PREFIX + code, { reliable: true, serialization: 'json' });
      conn.on('open', () => { opened = true; clearTimeout(timer); handlers.onOpen(conn); });
      conn.on('data', msg => handlers.onData(msg));
      conn.on('close', () => { if (opened && !done) { done = true; handlers.onClose(); } });
      conn.on('error', () => { if (opened && !done) { done = true; handlers.onClose(); } });
    });
    peer.on('error', err => {
      if (opened && err.type !== 'peer-unavailable') { if (!done) { done = true; handlers.onClose(); } return; }
      fail(err);
    });
    return { destroy() { done = true; clearTimeout(timer); peer.destroy(); } };
  }

  return { available, host, join, cleanCode, describe };
})();
</script>

<!-- ======================================================================
     APP: menu, host and client sessions, screens.
     ====================================================================== -->
<script>
'use strict';
(() => {
  const $app = document.getElementById('app');
  const $banner = document.getElementById('banner');
  Sim.setEvents(JSON.parse(document.getElementById('events').textContent));

  const area = n => { try { return window[n]; } catch (e) { return null; } };
  const store = {
    get(k, a = area('localStorage')) { try { return a ? a.getItem(k) : null; } catch (e) { return null; } },
    set(k, v, a = area('localStorage')) { try { if (a) a.setItem(k, v); } catch (e) { /* private mode */ } },
  };
  const SS = () => area('sessionStorage');
  // Per tab, so a refresh rejoins as the same player.
  const newPlayerId = () => { const id = 'p' + Math.random().toString(36).slice(2, 10); store.set('log.pid', id, SS()); return id; };
  const playerId = () => store.get('log.pid', SS()) || newPlayerId();
  const INSTANCE = Math.random().toString(36).slice(2, 10);
  const cleanName = n => String(n || '').replace(/[^\p{L}\p{N} _'.-]/gu, '').trim().slice(0, 12);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const money = n => (n < 0 ? '-£' : '£') + Math.abs(n).toLocaleString('en-GB');
  const signed = (n, f = String) => (n > 0 ? '+' : n < 0 ? '-' : '±') + f(Math.abs(n));

  let session = null;      // { act(type, data), destroy(), code, isHost }
  let view = null;         // latest view from the host
  let viewAt = 0;          // when it arrived (for the countdown)
  let menuMsg = '';

  const banner = t => { $banner.textContent = t || ''; };

  // --- host -------------------------------------------------------------------
  function createHost(name, resume) {
    const game = resume ? resume.game : Sim.createGame();
    const meId = playerId();
    const remotes = {};     // id -> conn
    let code = resume ? resume.code : '', dead = false;
    const now = () => Date.now();
    if (resume) {   // timers restart from where they were
      game.deadline = now() + (resume.left || 0);
      for (const p of Object.values(game.players)) if (p.id !== meId) p.seen = now();
    }
    Sim.addPlayer(game, meId, name, now());

    function send(conn, msg) { try { if (conn && conn.open) conn.send(msg); } catch (e) { /* closed */ } }
    function broadcast() {
      const t = now();
      for (const [id, conn] of Object.entries(remotes)) send(conn, { t: 'view', view: Sim.viewFor(game, id, t) });
      show(Sim.viewFor(game, meId, t));
      save();
    }
    function save() {
      store.set('log.host', JSON.stringify({ at: now(), name, code, left: Math.max(0, game.deadline - now()), game }), SS());
    }

    function onMsg(conn, msg) {
      if (!msg || typeof msg !== 'object' || dead) return;
      const id = conn.pid;
      if (msg.t === 'hello') {
        if (msg.v !== CONFIG.version) { send(conn, { t: 'version', v: CONFIG.version }); return; }
        const pid = String(msg.id || '').slice(0, 24);
        const old = remotes[pid];
        if (!pid || pid === meId || (old && old !== conn && old.open && old.inst !== msg.inst)) { send(conn, { t: 'dupe' }); return; }
        const res = Sim.addPlayer(game, pid, cleanName(msg.name) || 'Mate', now());
        if (res.err) { send(conn, { t: res.err }); setTimeout(() => conn.close(), 500); return; }
        if (old && old !== conn) try { old.close(); } catch (e) { /* gone */ }
        conn.pid = pid; conn.inst = msg.inst;
        remotes[pid] = conn;
        send(conn, { t: 'welcome' });
        broadcast();
        return;
      }
      if (!id || remotes[id] !== conn) return;
      Sim.setConnected(game, id, true, now());
      if (msg.t === 'ready' && Sim.setReady(game, id, msg.on)) broadcast();
      else if (msg.t === 'pick' && Sim.pick(game, id, msg.idx)) broadcast();
    }

    function onClose(conn) {
      if (dead || !conn.pid || remotes[conn.pid] !== conn) return;
      delete remotes[conn.pid];
      if (Sim.setConnected(game, conn.pid, false)) broadcast();
    }

    function startNet(wantCode) {
      return Net.host({
        onReady(c) { code = c; banner(''); history.replaceState(null, '', '?room=' + c); broadcast(); },
        onConnection(conn) {
          conn.on('data', m => onMsg(conn, m));
          conn.on('close', () => onClose(conn));
          conn.on('error', () => onClose(conn));
        },
        onError(err) { if (!code) { destroy(); toMenu(Net.describe(err)); } else banner(Net.describe(err)); },
      }, wantCode);
    }
    let net = startNet(resume ? resume.code : null);
    banner(resume ? `Bringing room ${resume.code} back…` : 'Opening a room…');

    const loop = setInterval(() => {
      const t = now();
      let changed = false;
      for (const p of Object.values(game.players)) {
        if (p.id !== meId && p.connected && t - p.seen > CONFIG.idleAfter * 1000) changed = Sim.setConnected(game, p.id, false) || changed;
      }
      if (Sim.tick(game, t)) changed = true;
      if (changed) broadcast();
    }, 200);

    function destroy() { dead = true; clearInterval(loop); if (net) net.destroy(); store.set('log.host', '', SS()); }
    function act(type, data) {
      const t = now();
      let ok = false;
      if (type === 'ready') ok = Sim.setReady(game, meId, data);
      else if (type === 'pick') ok = Sim.pick(game, meId, data);
      else if (type === 'start') ok = Sim.start(game, t);
      else if (type === 'again') { Sim.resetToLobby(game); ok = true; }
      if (ok) broadcast();
    }
    return { isHost: true, act, destroy, get code() { return code; } };
  }

  // --- client -----------------------------------------------------------------
  function createClient(name, code) {
    let meId = playerId();
    let net = null, conn = null, dead = false, entered = false, attempts = 0;
    const DELAYS = [1, 1.5, 2, 2.5, 3, 3, 3, 4, 5, 5];

    function connect() {
      net = Net.join(code, {
        onOpen(c) { conn = c; conn.send({ t: 'hello', id: meId, name, inst: INSTANCE, v: CONFIG.version }); },
        onData,
        onClose: lost,
        onError(err) { if (!entered) { destroy(); toMenu(Net.describe(err)); } else lost(); },
      });
    }
    function lost() {
      if (dead) return;
      conn = null;
      if (net) net.destroy();
      if (attempts >= DELAYS.length) { destroy(); toMenu('Lost the host. They may have closed the room.'); return; }
      banner(`Connection lost. Reconnecting… (${attempts + 1}/${DELAYS.length})`);
      setTimeout(() => { if (!dead) connect(); }, DELAYS[attempts++] * 1000);
    }
    function onData(msg) {
      if (!msg || typeof msg !== 'object' || dead) return;
      switch (msg.t) {
        case 'welcome':
          entered = true; attempts = 0; banner('');
          store.set('log.room', code, SS());
          history.replaceState(null, '', '?room=' + code);
          break;
        case 'view': show(msg.view); break;
        case 'dupe': meId = newPlayerId(); conn.send({ t: 'hello', id: meId, name, inst: INSTANCE, v: CONFIG.version }); break;
        case 'full': destroy(); toMenu('That room is full (4 players max).'); break;
        case 'started': destroy(); toMenu('That game has already started.'); break;
        case 'version': destroy(); toMenu(`The host has version ${msg.v} and you have ${CONFIG.version}. Close the tab and open the link again.`); break;
      }
    }
    const beat = setInterval(() => { if (conn && conn.open) try { conn.send({ t: 'ping' }); } catch (e) { /* closed */ } }, 2000);
    function destroy() { dead = true; clearInterval(beat); if (net) net.destroy(); store.set('log.room', '', SS()); }
    function act(type, data) {
      if (!conn || !conn.open) return;
      if (type === 'ready') conn.send({ t: 'ready', on: data });
      else if (type === 'pick') conn.send({ t: 'pick', idx: data });
    }
    banner(`Joining ${code}…`);
    connect();
    return { isHost: false, act, destroy, code };
  }

  // --- screens ----------------------------------------------------------------
  function toMenu(msg) {
    if (session) session.destroy();
    session = null; view = null;
    menuMsg = msg || '';
    banner('');
    history.replaceState(null, '', location.pathname);
    renderMenu();
  }

  function renderMenu() {
    const name = store.get('log.name') || '';
    const room = Net.cleanCode(new URLSearchParams(location.search).get('room') || '');
    $app.innerHTML = `
      <h1>Life of<br>Game</h1>
      <p class="muted">Twenty rounds. One lifetime. Four mates who'll happily ruin it.</p>
      <div class="grow"></div>
      <div class="stack">
        <input id="name" maxlength="12" placeholder="Your name" autocomplete="nickname" value="${esc(name)}">
        <button class="primary" data-act="host">Start a room</button>
        <div class="row"><input id="code" class="code" maxlength="4" placeholder="CODE" value="${esc(room)}" autocapitalize="characters"><button data-act="join">Join</button></div>
        <p class="err">${esc(menuMsg)}</p>
        <p class="muted small center">Version ${CONFIG.version}${Net.available() ? '' : ' · online play unavailable'}</p>
      </div>`;
  }

  function readName() {
    const n = cleanName(document.getElementById('name').value);
    if (!n) { menuMsg = 'Pop your name in first.'; renderMenu(); return null; }
    store.set('log.name', n);
    return n;
  }

  function show(v) {
    view = v; viewAt = Date.now();
    render();
  }

  const me = () => view.players.find(p => p.id === view.me) || {};
  const nameOf = id => { const p = view.players.find(q => q.id === id); return p ? p.name : '?'; };

  function statsBar() {
    const m = me();
    return `<div class="stats">
      <div class="stat m"><span class="k">Money</span><span class="v">${money(m.money)}</span></div>
      <div class="stat h"><span class="k">Health</span><span class="v">${m.health}</span></div>
      <div class="stat p"><span class="k">Happy</span><span class="v">${m.happiness}</span></div></div>`;
  }
  const topline = () => `<div class="topline"><span>${esc(CONFIG.stages[view.stage - 1].name)}</span><span>Round ${view.round} of ${view.rounds}</span></div>`;
  const timer = () => `<div class="timer"><i id="bar"></i></div>`;

  function render() {
    if (!view) return;
    const v = view;
    let html = '';
    if (v.phase === 'lobby') {
      const slots = [];
      for (let i = 0; i < CONFIG.maxPlayers; i++) {
        const p = v.players[i];
        slots.push(p
          ? `<div class="slot"><span>${esc(p.name)}${p.id === v.me ? ' <span class="muted small">(you)</span>' : ''}</span><span class="badge ${p.ready ? 'ok' : ''}">${p.ready ? 'Ready' : 'Not ready'}</span></div>`
          : `<div class="slot empty">Waiting for a mate…</div>`);
      }
      const ready = me().ready;
      html = `
        <p class="muted center" style="margin-top:24px">Room code</p>
        <div class="bigcode">${esc(session.code || '····')}</div>
        <button class="ghost" data-act="share">Copy invite link</button>
        <div class="slots">${slots.join('')}</div>
        <div class="grow"></div>
        <button class="${ready ? '' : 'primary'}" data-act="ready">${ready ? 'Not ready' : "I'm ready"}</button>
        ${session.isHost ? `<button class="primary" data-act="start" ${v.canStart ? '' : 'disabled'}>Start the game</button>
          <p class="muted small center">${v.canStart ? 'Everyone is ready.' : 'Starts when everyone is ready.'}</p>`
          : `<p class="muted small center">The host starts the game when everyone is ready.</p>`}
        <button class="ghost" data-act="leave">Leave</button>`;
    } else if (v.phase === 'stage') {
      const st = CONFIG.stages[v.stage - 1];
      html = `${statsBar()}<div class="hero"><div class="emoji">${st.emoji}</div>
        <p class="muted">Stage ${v.stage} of ${CONFIG.stages.length}</p><h2>${esc(st.name)}</h2>
        <p class="muted small">Rounds ${v.round} to ${v.round + v.perStage - 1}</p></div>`;
    } else if (v.phase === 'card' || v.phase === 'pick') {
      const picking = v.phase === 'pick';
      const opts = v.card.options.map((o, i) => `<button class="opt ${v.myPick === i ? 'chosen' : ''}" data-act="pick" data-i="${i}"
        ${!picking || v.myPick != null ? 'disabled' : ''}>${esc(o.label)}${o.default ? '<span class="def">Default if you run out of time</span>' : ''}</button>`).join('');
      const ticks = v.players.map(p => `<span class="tick ${p.locked ? 'on' : ''} ${p.connected ? '' : 'off'}">${p.locked ? '✓ ' : ''}${esc(p.name)}</span>`).join('');
      html = `${statsBar()}${topline()}${timer()}
        <div class="card stack"><h2>${esc(v.card.title)}</h2><p>${esc(v.card.text)}</p></div>
        <div class="stack">${opts}</div>
        <p class="muted small center">${!picking ? 'Have a read…' : v.myPick != null ? 'Locked in. Waiting for the others.' : 'Pick in secret.'}</p>
        <div class="ticks">${ticks}</div>`;
    } else if (v.phase === 'reveal' || v.phase === 'spin') {
      if (v.phase === 'reveal') {
        const rows = v.reveal.map((r, i) => {
          const d = r.delta;
          const chips = [
            d.money ? `<span class="d ${d.money > 0 ? 'up' : 'down'}">${signed(d.money, money)}</span>` : '',
            d.health ? `<span class="d ${d.health > 0 ? 'up' : 'down'}">${signed(d.health)} health</span>` : '',
            d.happiness ? `<span class="d ${d.happiness > 0 ? 'up' : 'down'}">${signed(d.happiness)} happy</span>` : '',
          ].join('') || '<span class="d">No change</span>';
          return `<div class="revrow" style="animation-delay:${0.15 + i * 0.35}s">
            <div class="who">${esc(nameOf(r.id))}${r.id === v.me ? ' <span class="muted small">(you)</span>' : ''}${r.auto ? '<span class="tag">AUTO</span>' : ''}</div>
            <div class="what">${esc(v.card.options[r.idx].label)}</div><div class="deltas">${chips}</div></div>`;
        }).join('');
        html = `${statsBar()}${topline()}${timer()}<h2>${esc(v.card.title)}</h2><div class="rev">${rows}</div>`;
      } else {
        const mine = v.spotlight === v.me;
        html = `${statsBar()}${topline()}${timer()}<div class="hero"><div class="emoji">🎡</div>
          <p class="muted">Spotlight</p><h2>${mine ? "You're up!" : esc(nameOf(v.spotlight)) + "'s spin"}</h2>
          <p class="muted small">The wheel arrives in milestone 5.</p></div>`;
      }
    } else if (v.phase === 'final') {
      const rows = v.standings.map((s, i) => `<div class="card rank"><span class="n">${i + 1}</span>
        <div><div style="font-weight:750">${esc(nameOf(s.id))}</div>
        <div class="muted small">${s.money} money · ${s.health} health · ${s.happiness} happy</div></div>
        <span class="s">${s.total}</span></div>`).join('');
      html = `<div class="center" style="margin-top:24px"><div class="emoji">🏆</div><h2>${esc(nameOf(v.standings[0].id))} lived best</h2>
        <p class="muted small">Life Score = money ÷ £500 (capped) + health + happiness</p></div>
        <div class="stack">${rows}</div><div class="grow"></div>
        ${session.isHost ? '<button class="primary" data-act="again">Play again</button>' : '<p class="muted center small">Waiting for the host to start another life.</p>'}
        <button class="ghost" data-act="leave">Leave</button>`;
    }
    $app.innerHTML = html;
    tickTimer();
  }

  function tickTimer() {
    const bar = document.getElementById('bar');
    if (!bar || !view) return;
    const total = (CONFIG.timings[view.phase] || 1) * 1000;
    const left = Math.max(0, view.left - (Date.now() - viewAt));
    bar.style.width = (100 * left / total).toFixed(1) + '%';
  }
  setInterval(tickTimer, 250);

  $app.addEventListener('click', e => {
    const b = e.target.closest('button[data-act]');
    if (!b || b.disabled) return;
    const a = b.dataset.act;
    if (a === 'host' || a === 'join') {
      if (session) return;
      const n = readName();
      if (!n) return;
      if (!Net.available()) { menuMsg = 'Online play is unavailable in this browser.'; renderMenu(); return; }
      if (a === 'host') session = createHost(n);
      else {
        const c = Net.cleanCode(document.getElementById('code').value);
        if (c.length !== 4) { menuMsg = 'Room codes are 4 letters.'; renderMenu(); return; }
        session = createClient(n, c);
      }
    } else if (!session) return;
    else if (a === 'ready') session.act('ready', !me().ready);
    else if (a === 'start') session.act('start');
    else if (a === 'again') session.act('again');
    else if (a === 'pick') { session.act('pick', +b.dataset.i); if (navigator.vibrate) navigator.vibrate(20); }
    else if (a === 'leave') toMenu();
    else if (a === 'share') {
      const url = location.origin + location.pathname + '?room=' + session.code;
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(
        () => { b.textContent = 'Link copied'; }, () => { b.textContent = url; });
    }
  });
  addEventListener('pagehide', e => { if (session && !e.persisted) { /* keep the saved state for a refresh */ } });

  // A refresh brings you back: the host re-opens the same room, a player rejoins it.
  (function resume() {
    let saved = null;
    try { saved = JSON.parse(store.get('log.host', SS()) || 'null'); } catch (e) { saved = null; }
    if (saved && saved.code && Date.now() - saved.at < 120000 && Net.available()) { session = createHost(saved.name, saved); return; }
    const room = store.get('log.room', SS());
    const name = store.get('log.name');
    if (room && name && Net.available()) { session = createClient(name, room); return; }
    renderMenu();
  })();
})();
</script>
</body>
</html>
